<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#243d48"/><rect x="20" y="20" width="860" height="560" rx="20" fill="#f6f3e9"/><g font-family="Arial,sans-serif" font-weight="600"><text x="55" y="65" font-size="16" fill="#617477">THE TROPHY THAT WALKED · YOUR CLUE</text><text x="55" y="115" font-size="34" fill="#243d48">A note inside the base</text><rect x="70" y="160" width="760" height="315" rx="16" fill="#e1ebe6"/><text x="110" y="225" font-size="28" fill="#243d48">I put a small SPEAKER here.</text><text x="110" y="290" font-size="28" fill="#243d48">It plays my party message.</text><text x="110" y="355" font-size="28" fill="#243d48">Surprise!</text><text x="110" y="430" font-size="32" fill="#243d48">From: the PE teacher</text><text x="55" y="546" font-size="22" fill="#46676c">Who is the PE teacher? Ask the People checker.</text></g></svg>