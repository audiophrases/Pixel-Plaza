<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#243d48"/><rect x="20" y="20" width="860" height="560" rx="20" fill="#f6f3e9"/><g font-family="Arial,sans-serif" font-weight="600"><text x="55" y="65" font-size="16" fill="#617477">THE TROPHY THAT WALKED · YOUR CLUE</text><text x="55" y="115" font-size="34" fill="#243d48">A note from the office</text><rect x="70" y="160" width="760" height="315" rx="16" fill="#e1ebe6"/><text x="110" y="225" font-size="28" fill="#243d48">LEAK ABOVE THE TROPHY.</text><text x="110" y="290" font-size="28" fill="#243d48">Move the trophy somewhere dry.</text><text x="110" y="355" font-size="28" fill="#243d48">Staff will repair the roof.</text><text x="110" y="430" font-size="25" fill="#243d48">9:00 · Before the duck arrived</text><text x="55" y="546" font-size="22" fill="#46676c">The note explains why the trophy needed moving.</text></g></svg>