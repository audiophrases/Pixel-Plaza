<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="600" rx="0" fill="#263b44"/><rect x="24" y="24" width="852" height="552" rx="16" fill="#f5f2e9"/><rect x="24" y="24" width="10" height="552" rx="0" fill="#b57c45"/><text x="62" y="70" font-size="16" fill="#617477" font-weight="700">SCHOOL RULES · STORM PLAN</text><text x="62" y="120" font-size="36" fill="#263b44" font-weight="700">In a storm</text><path d="M62 145H838" stroke="#ced5d0"/><rect x="62" y="176" width="776" height="74" rx="12" fill="#e0e9e6"/><circle cx="104" cy="213" r="22" fill="#315d56"/><text x="96" y="222" font-size="24" fill="#ffffff" font-weight="700">1</text><text x="146" y="224" font-size="30" fill="#263b44" font-weight="700">Stay in your classroom.</text><rect x="62" y="268" width="776" height="74" rx="12" fill="#ece9df"/><circle cx="104" cy="305" r="22" fill="#315d56"/><text x="96" y="314" font-size="24" fill="#ffffff" font-weight="700">2</text><text x="146" y="316" font-size="30" fill="#263b44" font-weight="400">Wait for your teacher.</text><rect x="62" y="360" width="776" height="74" rx="12" fill="#ece9df"/><circle cx="104" cy="397" r="22" fill="#315d56"/><text x="96" y="406" font-size="24" fill="#ffffff" font-weight="700">3</text><text x="146" y="408" font-size="30" fill="#263b44" font-weight="400">Never use the covered passage.</text><text x="62" y="545" font-size="16" fill="#617477" font-weight="400">Every classroom has this plan on the wall.</text></g></svg>