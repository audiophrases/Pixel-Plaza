<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="600" rx="0" fill="#263b44"/><rect x="24" y="24" width="852" height="552" rx="16" fill="#f5f2e9"/><rect x="24" y="24" width="10" height="552" rx="0" fill="#b57c45"/><text x="62" y="70" font-size="16" fill="#617477" font-weight="700">NEW MESSAGE · KARINA’S ACCOUNT</text><text x="62" y="120" font-size="36" fill="#263b44" font-weight="700">08:28</text><path d="M62 145H838" stroke="#ced5d0"/><rect x="62" y="176" width="776" height="287" rx="12" fill="#e0e9e6"/><text x="88" y="222" font-size="28" fill="#263b44" font-weight="400">I’m safe.</text><text x="88" y="260" font-size="28" fill="#263b44" font-weight="400">But the person you should be afraid of</text><text x="88" y="298" font-size="28" fill="#263b44" font-weight="400">isn’t Ms Diop.</text><text x="88" y="336" font-size="28" fill="#263b44" font-weight="400">It’s the person who told her</text><text x="88" y="374" font-size="28" fill="#263b44" font-weight="400">to keep quiet.</text><text x="62" y="545" font-size="16" fill="#617477" font-weight="400">Account name alone does not explain where this was sent.</text></g></svg>