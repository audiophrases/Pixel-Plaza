<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><g font-family="Arial, sans-serif"><rect x="0" y="0" width="900" height="600" rx="0" fill="#263b44"/><rect x="24" y="24" width="852" height="552" rx="16" fill="#f5f2e9"/><rect x="24" y="24" width="10" height="552" rx="0" fill="#b57c45"/><text x="62" y="70" font-size="16" fill="#617477" font-weight="700">WHAT PEOPLE SAY</text><text x="62" y="120" font-size="36" fill="#263b44" font-weight="700">Ms Diop, the PE teacher</text><path d="M62 145H838" stroke="#ced5d0"/><circle cx="140" cy="270" r="34" fill="#b5654a"/><rect x="92" y="312" width="96" height="110" rx="40" fill="#b5654a"/><rect x="232" y="186" width="606" height="138" rx="22" fill="#ffffff"/><path d="M234 272L196 296L240 254Z" fill="#ffffff"/><text x="262" y="238" font-size="31" fill="#263b44" font-weight="400">“The deputy head told me</text><text x="262" y="276" font-size="31" fill="#263b44" font-weight="400">to keep quiet. I was scared.”</text><text x="62" y="545" font-size="16" fill="#617477" font-weight="400">She helped Karina, but she lied.</text></g></svg>